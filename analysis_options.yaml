# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Desactivada a proposito: la regla propone renombrar los parametros con
    # nombre a `this._campo` cuando el campo es privado. Un parametro con
    # nombre forma parte de la API publica del constructor, y `_local:` o
    # `_recordatorios:` en cada llamada seria peor que la asignacion explicita
    # en la lista de inicializacion.
    prefer_initializing_formals: false
